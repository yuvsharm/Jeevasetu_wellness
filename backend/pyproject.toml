[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --cov=. --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.coverage.run]
omit = ["manage.py", "config/asgi.py", "config/wsgi.py", "config/settings/*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".pytest_cache", ".ruff_cache", ".venv", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
