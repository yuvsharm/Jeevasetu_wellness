name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install -r requirements/development.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python manage.py check --settings=config.settings.test
      - name: Production deployment check
        env:
          DJANGO_SECRET_KEY: safe-ci-only-9Qx7-mR2-vT8-kL4-pN6-dF3-zC5-hJ1-sW0-uY7-G
          DJANGO_ALLOWED_HOSTS: api.example.test
          DJANGO_CORS_ALLOWED_ORIGINS: https://app.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.test
          DATABASE_URL: postgresql://check_user:check_password@db.example.test:5432/check_db
          REDIS_URL: rediss://redis.example.test:6379/0
        run: python manage.py check --deploy --settings=config.settings.production
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --settings=config.settings.test --validate --file openapi.yaml
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
