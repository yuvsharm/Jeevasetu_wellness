services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeevasetu}
      POSTGRES_USER: ${POSTGRES_USER:-jeevasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeevasetu}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [jeevasetu]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [redis_data:/data]
    networks: [jeevasetu]

  backend:
    build:
      context: ./backend
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-jeevasetu}:${POSTGRES_PASSWORD:-jeevasetu}@postgres:5432/${POSTGRES_DB:-jeevasetu}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [jeevasetu]

  frontend:
    build:
      context: ./frontend
      target: development
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
    networks: [jeevasetu]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  jeevasetu:
    driver: bridge

